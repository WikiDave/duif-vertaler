<style>
/* Layout: één smalle kolom zoals een vertaal-app op de telefoon: topbalk, modus-chips, talenrij, invoer, vertaling, geschiedenis. */
:root {
  --bg: #ffffff;
  --fg: #1f1f1f;
  --muted: #5f6368;
  --line: #dadce0;
  --blue: #0b57d0;
  --chip-on: #d3e3fd;
  --out-bg: #f0f4f9;
  --hover: #f1f3f4;
  --neck-1: #1e8e7e;   /* nekglans groen */
  --neck-2: #8e4a86;   /* nekglans paars */
  --slate: #7a8296;    /* duivengrijs */
  --crumb: #e0a65e;
  --act: #8e4a86;
  --font-ui: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-mark: "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1f; --fg: #e3e3e3; --muted: #a8abb0; --line: #3c4043; --blue: #a8c7fa; --chip-on: #004a77;
    --out-bg: #282a2c; --hover: #2d2f31; --neck-1: #5cc4b5; --neck-2: #d39bce; --slate: #9aa3b8; --act: #d39bce;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --fg: #e3e3e3; --muted: #a8abb0; --line: #3c4043; --blue: #a8c7fa; --chip-on: #004a77;
  --out-bg: #282a2c; --hover: #2d2f31; --neck-1: #5cc4b5; --neck-2: #d39bce; --slate: #9aa3b8; --act: #d39bce;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; }
.app { max-width: 760px; margin: 0 auto; padding-bottom: 48px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* topbalk */
.top { display: flex; align-items: center; gap: 6px; padding-block: 14px 10px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.round:hover { background: var(--hover); }
.round svg { width: 24px; height: 24px; }
.mark { display: flex; align-items: baseline; gap: 8px; margin: 0 auto 0 4px; min-width: 0; white-space: nowrap; }
.mark .duif { font-family: var(--font-mark); font-size: 27px; letter-spacing: -.01em; }
.mark .duif b:nth-child(1) { color: var(--slate); font-weight: 400; }
.mark .duif b:nth-child(2) { color: var(--neck-1); font-weight: 400; }
.mark .duif b:nth-child(3) { color: var(--neck-2); font-weight: 400; }
.mark .duif b:nth-child(4) { color: var(--crumb); font-weight: 400; }
.mark .vert { font-size: 26px; color: var(--fg); }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--out-bg); display: grid; place-items: center; overflow: hidden; flex: none; margin-left: 4px; }

/* modus-chips */
.chips { display: flex; gap: 8px; padding-block: 6px 14px; overflow-x: auto; scrollbar-width: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--blue); font-weight: 500; font-size: 15px; cursor: pointer; white-space: nowrap; flex: none; }
.chip svg { width: 20px; height: 20px; }
.chip.on { background: var(--chip-on); border-color: transparent; color: var(--fg); }
.chip.on svg { color: var(--fg); }

/* talenrij */
.langs { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; border-bottom: 1px solid var(--line); padding-block: 4px; }
.langbtn { border: 0; background: none; color: var(--blue); font-weight: 500; font-size: 16px; height: 48px; border-radius: 24px; cursor: pointer; padding: 0 8px; min-width: 0; }
.langbtn:hover { background: var(--hover); }
.langbtn small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); line-height: 1; margin-top: -2px; }
.swap { justify-self: center; transition: transform .3s ease; color: var(--muted); }
.swap.spin { transform: rotate(180deg); }

/* invoer */
.input { position: relative; padding-block: 18px 8px; border-bottom: 1px solid var(--line); }
textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; color: var(--fg); font: inherit; font-size: 28px; line-height: 1.35; min-height: 150px; padding: 0 36px 0 0; }
textarea::placeholder { color: var(--muted); opacity: .75; }
.clear { position: absolute; right: max(4px, env(safe-area-inset-right, 0px)); top: 10px; }
.clear[hidden] { display: none; }
.input-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-left: -10px; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.detect { font-size: 13px; color: var(--muted); margin: 0 0 4px; min-height: 20px; }
.suggest { font-size: 15px; color: var(--muted); margin: 6px 0 4px; }
.suggest button { border: 0; background: none; padding: 0; color: var(--blue); font-style: italic; font-weight: 500; cursor: pointer; }

/* vertaling */
.output { background: var(--out-bg); padding-block: 16px 6px; }
.out-lang { font-size: 14px; color: var(--blue); font-weight: 500; margin: 0 0 6px; }
.out-text { font-size: 28px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 40px; transition: opacity .15s; }
.out-text.busy { opacity: .45; }
.out-text .act { color: var(--act); font-style: italic; }
.out-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.out-meta b { color: var(--fg); font-weight: 500; }
.out-actions { display: flex; align-items: center; gap: 2px; margin: 6px 0 0 -10px; }
.out-actions .grow { flex: 1; }
.round.on { color: var(--blue); }
.round.playing { color: var(--neck-1); }

.feedback { text-align: right; font-style: italic; color: var(--muted); font-size: 14px; padding-block: 12px; }
.feedback button { border: 0; background: none; color: inherit; font-style: italic; cursor: pointer; padding: 0; }

/* geschiedenis / opgeslagen */
.shortcuts { display: flex; justify-content: center; gap: 48px; padding-block: 24px; }
.sc { display: grid; justify-items: center; gap: 10px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; }
.sc .circle { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background .15s; }
.sc .circle svg { width: 34px; height: 34px; }
.sc:hover .circle, .sc[aria-pressed="true"] .circle { background: var(--hover); }
.sc[aria-pressed="true"] { color: var(--blue); }

.list { border-top: 1px solid var(--line); }
.list h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 14px 0 4px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding-block: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--hover); }
.item .pair { font-size: 12px; color: var(--muted); }
.item .s { min-width: 0; overflow-wrap: anywhere; }
.item .t { color: var(--muted); min-width: 0; overflow-wrap: anywhere; grid-column: 1; }
.item .del { grid-row: 1 / span 3; grid-column: 2; align-self: center; width: 36px; height: 36px; }
.empty { color: var(--muted); padding-block: 20px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; align-items: end; justify-items: center; z-index: 20; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; border-radius: 20px 20px 0 0; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 8px 0; }
.opt { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 14px 8px; border-radius: 8px; cursor: pointer; }
.opt:hover { background: var(--hover); }
.opt .tick { width: 20px; color: var(--blue); }
.opt span small { display: block; color: var(--muted); font-size: 13px; }

.bob .avatar .head { animation: peck .32s ease-in-out 3; transform-origin: 22px 16px; }
@keyframes peck { 50% { transform: rotate(14deg) translateY(1px); } }

@media (max-width: 420px) {
  .mark .duif, .mark .vert { font-size: 22px; }
  .top .hide-s { display: none; }
  textarea, .out-text { font-size: 24px; }
  .shortcuts { gap: 32px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const src = $("src"), out = $("out");
  let dir = "nl2duif";
  let dialect = "stad";
  const DIALECTS = { stad: ["Stadsduif", "Te horen op elk treinstation"], post: ["Postduif", "Formeel, voor afstanden tot 1000 km"], hout: ["Houtduif", "Plattelands, klinkt het best om 5 uur ’s ochtends"] };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // FNV-1a: dezelfde invoer geeft altijd dezelfde vertaling
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  const pick = (arr, h) => arr[h % arr.length];

  const DICT = {
    brood: "RROEKOEKOE!!", broodje: "ROEKOE!! roekoe!!", boterham: "ROE-KOE-KOE!!",
    kruimel: "koe-koe-koe", kruimels: "koe-koe-koe-koe-koe",
    friet: "ROEKOE!!! *roept 47 vrienden*", patat: "ROEKOE!!! *roept 47 vrienden*", frietje: "ROEKOE!!! *roept 47 vrienden*",
    kat: "*vliegt in paniek weg*", poes: "*vliegt in paniek weg*", hond: "*fladdert 40 cm opzij*",
    meeuw: "grrrrr… *kijkt vuil*",
    ja: "roe.", nee: "rrrrr.", misschien: "roe… koe?",
    hallo: "roekoe~", hoi: "roekoe~", dag: "roekoe~", doei: "*vliegt weg zonder groeten*",
    liefde: "*blaast nek op* roekoeroekoe", schat: "*blaast nek op* roekoe", lief: "*draait rondje* roekoe",
    standbeeld: "*poept*", beeld: "*poept*", auto: "*loopt pas op het laatste moment weg*", fiets: "*loopt rustig verder*",
    ik: "roe", jij: "koe?", je: "koe?", wij: "roe-roe", mijn: "ROE", eten: "pik-pik-pik", honger: "pik-pik-pik-pik?",
    duif: "*knikt met hoofd*", duiven: "*knikt met hoofd* ×12", station: "*tript rond*", dak: "rrroe~",
    sorry: "*kijkt weg*", dank: "roekoe.", bedankt: "roekoe.", alsjeblieft: "koe… koe?",
  };
  const SYL = {
    stad: ["roe", "koe", "rroe", "koerr", "grrroe", "oe", "roekoe", "krr", "boe"],
    post: ["Roe", "Koe", "Roekoe", "Oe", "Hoekoe", "Rroe"],
    hout: ["hoe", "hoe-hoe", "roe-KOE", "koe-koe", "oe", "hoe-KOE"],
  };

  function nlToDuif(text, d) {
    const parts = text.split(/(\s+|[.,!?;:]+)/).filter((p) => p !== "");
    const res = parts.map((p) => {
      if (/^\s+$/.test(p)) return p;
      if (/^[.,!?;:]+$/.test(p)) {
        if (p.includes("?")) return "?";
        if (p.includes("!")) return "!! *fladder*";
        return p;
      }
      const w = p.toLowerCase().replace(/[^a-zà-ÿ'-]/g, "");
      if (!w) return p;
      if (DICT[w]) return DICT[w];
      const h = hash(w + d);
      const n = Math.min(4, Math.max(1, Math.ceil(w.length / 3)));
      const syl = [];
      for (let i = 0; i < n; i++) syl.push(pick(SYL[d], hash(w + i + d)));
      let s = syl.join(h % 3 === 0 ? "-" : "");
      if (/[A-Z]/.test(p[0])) s = s[0].toUpperCase() + s.slice(1);
      return s;
    });
    let txt = res.join("").replace(/\s+([?!.,])/g, "$1").trim();
    if (d === "post" && txt) txt = "Geachte duif,\n" + txt + "\nHoogachtend, roe.";
    if (d === "hout" && txt) txt += " … roe-KOE-koe, roe-koe.";
    return txt;
  }

  const NL_LINES = [
    "Waar is het brood?", "Dit is mijn bankje.", "Ik heb niks gezien.", "Die meeuw deugt niet.",
    "Heb je dat standbeeld gezien? Prachtig. Ik ga er even op zitten.", "Loop maar door, ik sta hier prima.",
    "Kun je wat sneller eten? Er vallen te weinig kruimels.", "Ik ben niet bang voor je. Behalve als je beweegt.",
    "Mijn neef woont op de Dam. Hij is erg belangrijk.", "Is dat een broodje kroket? Ik vraag het voor een vriend.",
    "Ik loop gewoon even met mijn hoofd te knikken.", "Ik zat hier eerst.", "Wanneer gaat die trein? Ik ga niet mee hoor.",
    "Kijk hoe glimmend mijn nek is.", "Ik woon onder het viaduct. Mooie buurt.", "Daar ligt iets. Het is vast eten.",
    "Ik ga pas weg als je auto echt heel dichtbij is.", "Iemand heeft hier friet laten vallen. Vertel het niemand.",
    "Ik heb een plan. Het gaat over brood.", "Rustig. Ik doe alleen een rondje.", "Mag ik op je balkon wonen?",
    "Die man op het bankje heeft zaadjes. Ik voel het.", "Ik ben gisteren een stukje met de tram meegelopen.",
    "Dit plein is van mij en van die andere 300.", "Jij hebt mooie schoenen. Ik ga er even naast lopen.",
    "Ken je de weg naar Den Bosch? Ik moet een brief bezorgen.",
  ];
  const ACT_NL = {
    poept: "(geeft een kunstkritiek)", vliegt: "(heeft een afspraak)", knikt: "(is het met je eens)",
    blaast: "(probeert indruk te maken)", kijkt: "(oordeelt stil)", fladder: "(is enthousiast)",
  };
  function actionNote(seg) {
    const a = seg.match(/\*([^*]+)\*/);
    if (!a) return null;
    const verb = a[1].trim().split(/\s+/)[0].toLowerCase();
    const key = Object.keys(ACT_NL).find((k) => verb.startsWith(k));
    return key ? ACT_NL[key] : null;
  }

  function duifToNl(text) {
    const raw = text.trim();
    if (!raw) return "";
    const segs = raw.split(/(?<=[.!?…~])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
    return segs.map((seg) => {
      const note = actionNote(seg);
      if (note && seg.replace(/\*[^*]+\*/g, "").trim() === "") return note;
      const clean = seg.replace(/\*[^*]+\*/g, "").toLowerCase();
      let line = pick(NL_LINES, hash(clean.replace(/[^a-z]/g, "")));
      if (clean.split(/\s+/).filter(Boolean).length > 4) line += " " + pick(NL_LINES, hash(clean + "#2"));
      if ((seg.match(/!/g) || []).length >= 2 || /[A-Z]{4,}/.test(seg)) line = line.replace(/[.?]$/, "") + "!!!";
      if (note) line += " " + note;
      return line;
    }).join(" ");
  }

  const MOODS = ["Hongerig", "Territoriaal", "Verliefd", "Achterdochtig", "Verveeld", "Zelfvoldaan"];
  function looksLikePigeon(t) {
    const words = t.toLowerCase().match(/[a-zà-ÿ]+/g) || [];
    if (!words.length) return true;
    const pig = words.filter((w) => /^(r*o*e*k*o*e*r*|h*o+e+|k*r+|g*r+o*e*|b*o+e+|pik)+$/.test(w) && /[oe]{2}|rr|pik/.test(w));
    return pig.length / words.length > 0.6;
  }

  function render(txt) {
    const esc = txt.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    return esc.replace(/\*([^*]+)\*/g, '<span class="act">*$1*</span>')
      .replace(/(\((?:geeft|heeft|is|probeert|oordeelt)[^)]*\))/g, '<span class="act">$1</span>');
  }

  const srcName = () => (dir === "nl2duif" ? "Nederlands" : "Duifs");
  const dstName = () => (dir === "nl2duif" ? "Duifs" : "Nederlands");
  let current = { src: "", out: "" };
  let timer, histTimer;

  function translate(instant) {
    const text = src.value;
    $("count").textContent = text ? `${text.length} / 5000` : "";
    $("clear").hidden = !text;
    clearTimeout(timer);
    out.classList.add("busy");
    timer = setTimeout(() => {
      out.classList.remove("busy");
      const result = dir === "nl2duif" ? nlToDuif(text, dialect) : duifToNl(text);
      current = { src: text.trim(), out: result, dir, dialect };
      $("outWrap").hidden = !result;
      out.innerHTML = render(result);

      const h = hash(text + dialect + dir);
      $("mood").textContent = /brood|kruimel|friet|patat|eten|honger|roekoe!!/i.test(text) ? "Heel erg hongerig"
        : /lief|schat|liefde|nek op/i.test(text) ? "Verliefd"
        : /kat|hond|meeuw/i.test(text) ? "Achterdochtig" : pick(MOODS, h);
      $("conf").textContent = 61 + (h % 38) + "%";
      updateStar();

      const detect = $("detect"), sug = $("suggest");
      sug.hidden = true;
      if (!text.trim()) detect.textContent = "";
      else if (dir === "nl2duif") detect.innerHTML = "Gedetecteerd: <b>Nederlands</b>";
      else {
        const ok = looksLikePigeon(text);
        detect.innerHTML = ok ? "Gedetecteerd: Duifs (" + pick(["Damrak", "Coolsingel", "Vredenburg", "Grote Markt", "Station Zwolle"], h) + "-dialect)" : "Gedetecteerd: Mens";
        if (!ok) {
          sug.hidden = false;
          sug.innerHTML = 'Bedoelde u: <button type="button" id="sugBtn">roekoe roekoe?</button>';
          $("sugBtn").onclick = () => { src.value = "roekoe roekoe?"; translate(true); };
        }
      }

      clearTimeout(histTimer);
      if (result) histTimer = setTimeout(() => addHistory(current), 1500);
    }, instant ? 0 : 250);
  }

  function setDir(d) {
    dir = d;
    $("srcLang").textContent = srcName();
    $("dstLang").innerHTML = dstName() + (d === "nl2duif" ? `<small>${DIALECTS[dialect][0]}</small>` : "");
    $("outLang").textContent = dstName() + (d === "nl2duif" ? " · " + DIALECTS[dialect][0] : "");
  }

  $("swap").addEventListener("click", () => {
    $("swap").classList.toggle("spin");
    const translated = current.out;
    setDir(dir === "nl2duif" ? "duif2nl" : "nl2duif");
    src.value = translated;
    translate(true);
  });
  src.addEventListener("input", () => translate(false));
  $("clear").addEventListener("click", () => { src.value = ""; translate(true); src.focus(); });

  // dialectkiezer als onderblad
  function openSheet() {
    if (dir !== "nl2duif") return toast("Kies eerst Nederlands → Duifs om een dialect te kiezen");
    const bg = document.createElement("div");
    bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet gutter" role="dialog" aria-label="Dialect kiezen"><h3>Vertalen naar</h3>${Object.entries(DIALECTS).map(([k, [n, d]]) =>
      `<button class="opt" type="button" data-k="${k}"><span class="tick">${k === dialect ? "✓" : ""}</span><span>${n}<small>${d}</small></span></button>`).join("")}</div>`;
    bg.addEventListener("click", (e) => {
      const opt = e.target.closest(".opt");
      if (opt) { dialect = opt.dataset.k; setDir(dir); translate(true); }
      if (opt || e.target === bg) bg.remove();
    });
    document.body.appendChild(bg);
    bg.querySelector(".opt").focus();
  }
  $("dstLang").addEventListener("click", openSheet);
  $("srcLang").addEventListener("click", () => toast(dir === "nl2duif" ? "Alleen Nederlands. Duiven spreken geen Engels." : "Duifs wordt automatisch gedetecteerd"));

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
  }
  document.querySelectorAll("[data-joke]").forEach((b) => b.addEventListener("click", () => toast(b.dataset.joke)));
  $("menu").addEventListener("click", () => toast("Het menu is door een duif opgegeten"));
  $("settings").addEventListener("click", () => toast("Instellingen: altijd brood"));
  $("apps").addEventListener("click", () => toast("Andere apps: Duif Maps (alleen pleinen)"));
  $("mic").addEventListener("click", () => toast("Houd je telefoon bij een duif en wacht. Nee, grapje: typ maar."));
  $("feedback").addEventListener("click", () => toast("Bedankt! Je feedback is per postduif onderweg."));

  $("copy").addEventListener("click", async () => {
    if (!current.out) return;
    try { await navigator.clipboard.writeText(current.out); toast("Vertaling gekopieerd"); }
    catch {
      const r = document.createRange(); r.selectNodeContents(out);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("Tekst geselecteerd, kopieer met Ctrl+C");
    }
  });

  // geschiedenis en opgeslagen (alleen in deze browser)
  const key = (e) => e.dir + "|" + e.dialect + "|" + e.src;
  function addHistory(e) {
    if (!e.src) return;
    const h = store.get("duif-hist").filter((x) => key(x) !== key(e));
    h.unshift(e); store.set("duif-hist", h.slice(0, 30));
    if (view === "hist") showList("hist");
  }
  function updateStar() {
    const on = store.get("duif-saved").some((x) => key(x) === key(current));
    $("star").classList.toggle("on", on);
    $("star").setAttribute("aria-pressed", on);
    $("star").querySelector("path").setAttribute("fill", on ? "currentColor" : "none");
  }
  $("star").addEventListener("click", () => {
    if (!current.src) return;
    let s = store.get("duif-saved");
    const exists = s.some((x) => key(x) === key(current));
    s = exists ? s.filter((x) => key(x) !== key(current)) : [current, ...s];
    store.set("duif-saved", s);
    updateStar();
    toast(exists ? "Verwijderd uit Opgeslagen" : "Opgeslagen");
    if (view === "saved") showList("saved");
  });

  let view = null;
  function showList(which) {
    const list = $("list");
    const isHist = which === "hist";
    const items = store.get(isHist ? "duif-hist" : "duif-saved");
    const pairName = (e) => e.dir === "nl2duif" ? `Nederlands → Duifs (${DIALECTS[e.dialect][0]})` : "Duifs → Nederlands";
    list.innerHTML = `<h2>${isHist ? "Geschiedenis" : "Opgeslagen"}</h2>` + (items.length
      ? items.map((e, i) => `<div class="item" data-i="${i}" tabindex="0"><span class="pair">${pairName(e)}</span><span class="s">${render(e.src)}</span><span class="t">${render(e.out)}</span><button class="round del" type="button" data-del="${i}" aria-label="Verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`).join("")
      : `<p class="empty">${isHist ? "Nog niets vertaald. Typ iets hierboven." : "Tik op de ster bij een vertaling om hem te bewaren."}</p>`);
    list.onclick = (ev) => {
      const del = ev.target.closest("[data-del]");
      if (del) {
        const arr = store.get(isHist ? "duif-hist" : "duif-saved");
        arr.splice(+del.dataset.del, 1);
        store.set(isHist ? "duif-hist" : "duif-saved", arr);
        showList(which); updateStar(); return;
      }
      const it = ev.target.closest(".item");
      if (!it) return;
      const e = items[+it.dataset.i];
      dialect = e.dialect; setDir(e.dir); src.value = e.src; translate(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  }
  function toggleView(which) {
    view = view === which ? null : which;
    $("histBtn").setAttribute("aria-pressed", view === "hist");
    $("savedBtn").setAttribute("aria-pressed", view === "saved");
    $("list").hidden = !view;
    if (view) showList(view);
  }
  $("histBtn").addEventListener("click", () => toggleView("hist"));
  $("savedBtn").addEventListener("click", () => toggleView("saved"));

  // koeren met WebAudio: sinus met lage tremolo en een dalende toonhoogte per lettergreep
  let ctx;
  function coo(t0, dur, f0, f1, loud) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain(), filt = ctx.createBiquadFilter();
    o.type = "sine"; filt.type = "lowpass"; filt.frequency.value = 900;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.linearRampToValueAtTime(f0 * 1.08, t0 + dur * 0.3);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    lfo.frequency.value = 28; lg.gain.value = 0.35;
    lfo.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5 * loud, t0 + 0.04);
    g.gain.setValueAtTime(0.45 * loud, t0 + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(filt); filt.connect(g); g.connect(ctx.destination);
    o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
  }
  $("listen").addEventListener("click", async () => {
    const pigeonText = dir === "nl2duif" ? current.out : src.value;
    const syllables = (pigeonText.toLowerCase().match(/roe|koe|hoe|oe|rr+|boe|pik/g) || []).slice(0, 40);
    if (!syllables.length) return toast("Niets om te koeren");
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();
    } catch { return toast("Je browser laat geen geluid toe"); }
    const base = dir !== "nl2duif" ? 270 : dialect === "hout" ? 330 : dialect === "post" ? 300 : 270;
    const loud = /!!/.test(pigeonText) ? 1 : 0.8;
    let t = ctx.currentTime + 0.05;
    syllables.forEach((s, i) => {
      if (s === "pik") { coo(t, 0.05, 1400, 1200, 0.25); t += 0.12; return; }
      if (s.startsWith("rr")) { coo(t, 0.28, base * 0.9, base * 0.8, loud); t += 0.32; return; }
      const d = s === "koe" ? 0.42 : 0.26;
      coo(t, d, base * (s === "koe" ? 1.12 : 1), base * 0.78, loud);
      t += d + (i % 3 === 2 ? 0.28 : 0.06);
    });
    $("listen").classList.add("playing");
    document.body.classList.add("bob");
    setTimeout(() => { $("listen").classList.remove("playing"); document.body.classList.remove("bob"); }, (t - ctx.currentTime) * 1000);
  });

  setDir("nl2duif");
  translate(true);
})();
</script>
